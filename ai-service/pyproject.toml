[project]
name = "alagance-ai-service"
version = "0.1.0"
description = "CrewAI HTTP service for Alagance"
requires-python = ">=3.11,<3.14"
dependencies = [
    "crewai>=1.10,<2",
    "fastapi>=0.116,<1",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
