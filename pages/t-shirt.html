<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>T-shirt - VielaDefis</title>
    <!-- Fonts -->
    <link
      href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vollkorn:ital,wght@0,400..900;1,400..900&display=swap"
      rel="stylesheet"
    />
    <!-- Feather Icons -->
    <script src="https://unpkg.com/feather-icons"></script>
    <link href="../styles/style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="announcementBar">
      <p>
        Sign Up and get 20% off to your first order. <a href="#">Sign up</a>
      </p>
    </div>
    <div class="header-top">
      <a href="index.html" class="header-logo">
        <img
          src="../assets/image/logo.png"
          alt="logo"
          width="170"
          height="170"
        />
      </a>
      <div class="header-menu">
        <ul class="desktop-menu-category-list">
          <li class="menu-category">
            <a href="#" class="menu-title">Shop</a>

            <ul class="dropdown-list">
              <li class="dropdown-item">
                <a href="#">T-Shirt</a>
              </li>

              <li class="dropdown-item">
                <a href="#">Hoodie</a>
              </li>
            </ul>
          </li>

          <li class="menu-category">
            <a href="#" class="menu-title">New Arrival</a>
          </li>

          <li class="menu-category">
            <a href="#" class="menu-title">On Sale</a>
          </li>

          <li class="menu-category">
            <a href="#" class="menu-title">Brands</a>
          </li>
        </ul>

        <div class="header-search-container">
          <input
            type="search"
            name="search"
            class="search-field"
            placeholder="Search for products.."
          />
        </div>

        <div class="header-user-actions">
          <button class="action-btn">
            <i data-feather="heart"></i>
          </button>

          <button class="action-btn">
            <i data-feather="shopping-cart"></i>
            <span class="count">0</span>
          </button>

          <button class="action-btn">
            <i data-feather="user"></i>
            <span class="count">0</span>
          </button>
        </div>
      </div>
    </div>
    <!-- Feather Icons -->
    <script>
      feather.replace();
    </script>
  </body>
</html>
